file = '%LOCALAPPDATA%\FortniteGame\Saved\Config\WindowsClient\GameUserSettings.ini'
section = "/Script/FortniteGame.FortGameUserSettings"
key = "bMotionBlur"
apply = "False"
default = "True"
[[tweak.actions]]
type = "ini"
file = '%LOCALAPPDATA%\FortniteGame\Saved\Config\WindowsClient\GameUserSettings.ini'
section = "/Script/FortniteGame.FortGameUserSettings"
key = "bShowGrass"
apply = "False"
default = "True"
[[tweak.actions]]
type = "ini"
file = '%LOCALAPPDATA%\FortniteGame\Saved\Config\WindowsClient\GameUserSettings.ini'
section = "/Script/FortniteGame.FortGameUserSettings"
key = "bDisableMouseAcceleration"
apply = "True"
default = "False"

