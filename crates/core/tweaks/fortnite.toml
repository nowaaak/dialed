# Fortnite. Erlaubt sind nur Windows-Einstellungen und die GameUserSettings.ini.
# Nichts hier greift in den laufenden Prozess ein.

[[tweak]]
id = "fn.cpu_priority"
name = "CPU-Priorität Hoch"
category = "fortnite"
description = "Windows startet FortniteClient-Win64-Shipping.exe direkt mit hoher CPU-Priorität. Im Task-Manager geht das wegen Easy Anti-Cheat nicht, über diesen Registry-Weg schon, weil die Priorität beim Prozessstart vergeben wird."
note = "Von Epic nicht offiziell freigegeben, in der Community seit Jahren ohne Banns im Einsatz. Hoch kann Audio- und Treiber-Threads verdrängen. Bei Knacksen oder Eingabehängern zurücksetzen."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\FortniteClient-Win64-Shipping.exe\PerfOptions'
name = "CpuPriorityClass"
kind = "dword"
apply = 3

[[tweak]]
id = "fn.io_priority"
name = "I/O-Priorität Hoch"
category = "fortnite"
description = "Datenträgerzugriffe von Fortnite werden vor Hintergrundprozessen bedient. Hilft beim Nachladen von Texturen, wenn nebenbei Downloads oder Updates laufen."
note = "Gleicher Mechanismus wie die CPU-Priorität, gleiche Einordnung bei Anti-Cheat."
evidence = "C"
risk = "low"
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\FortniteClient-Win64-Shipping.exe\PerfOptions'
name = "IoPriority"
kind = "dword"
apply = 3

[[tweak]]
id = "fn.segment_heap_off"
name = "Segment Heap aus"
category = "fortnite"
description = "Fortnite nutzt den älteren NT-Heap statt des Segment Heaps. Der Segment Heap spart Speicher, kostet aber bei vielen kleinen Allokationen etwas CPU-Zeit."
note = "Wirkung ist nicht mit Messungen belegt. Bei Abstürzen oder höherem RAM-Verbrauch zurücksetzen."
evidence = "C"
risk = "medium"
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\FortniteClient-Win64-Shipping.exe'
name = "FrontEndHeapDebugOptions"
kind = "dword"
apply = 4

[[tweak]]
