# Weitere Spiele

[[tweak]]
id = "cs2.cpu_priority"
name = "CS2: CPU-Priorität Hoch"
category = "games"
description = "Windows startet cs2.exe direkt mit hoher CPU-Priorität."
note = "Bei Tonknacksen oder Eingabehängern zurücksetzen."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\cs2.exe\PerfOptions'
name = "CpuPriorityClass"
kind = "dword"
apply = 3

[[tweak]]
id = "valorant.hvci_on"
name = "Valorant: Speicherintegrität an"
category = "games"
kind = "check"
description = "Riot Vanguard kann die Speicherintegrität (HVCI) verlangen. Ist sie aus, startet Valorant unter Umständen nicht."
note = "Steht im Konflikt mit dem Tweak „Speicherintegrität (HVCI) aus“. Wer Valorant spielt, lässt HVCI an."
evidence = "A"
risk = "low"
requires = ["win11"]
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
name = "Enabled"
kind = "dword"
apply = 1

[[tweak]]
id = "valorant.boot_check"
name = "Valorant: Secure Boot und TPM 2.0"
category = "games"
kind = "check"
description = "Unter Windows 11 startet Valorant nur mit aktivem Secure Boot und TPM 2.0 (Fehler VAN 9001 und VAN 9003)."
note = "Beides wird im BIOS eingeschaltet."
evidence = "A"
risk = "low"
requires = ["win11"]
[[tweak.actions]]
type = "ps"
detect = "try { if (Confirm-SecureBootUEFI) { '1' } else { '0' } } catch { '0' }"
expect = "1"
[[tweak.actions]]
type = "ps"
detect = "if ((Get-Tpm).TpmPresent) { '1' } else { '0' }"
expect = "1"

[[tweak]]
id = "mc.vsync_fps"
name = "Minecraft: V-Sync aus und FPS-Limit"
category = "games"
description = "Schaltet V-Sync in allen Minecraft-Profilen ab und begrenzt die FPS knapp unter die Bildwiederholrate, in Zehnerschritten wie im Spiel. Gilt für das normale Minecraft und für Profile des NoRisk Clients."
note = "Minecraft vorher schließen, das Spiel schreibt die options.txt beim Beenden neu."
evidence = "A"
risk = "low"
requires = ["minecraft"]
[[tweak.actions]]
type = "ps"
detect = '''
$files = @(Get-ChildItem -Path "$env:APPDATA\norisk\NoRiskClientV3\data\profiles\*\options.txt", "$env:APPDATA\.minecraft\options.txt" -ErrorAction SilentlyContinue)
$want = [math]::Floor(([int]$env:DIALED_REFRESH - 3) / 10) * 10
if ($files.Count -eq 0) { 'Minecraft nicht gefunden' } else {
  $bad = @($files | Where-Object { $t = [IO.File]::ReadAllText($_.FullName); $t -notmatch '(?m)^enableVsync:false\r?$' -or $t -notmatch "(?m)^maxFps:$want\r?$" })
  if ($bad.Count -eq 0) { '1' } else { '0' }
}
'''
expect = "1"
apply = '''
$want = [math]::Floor(([int]$env:DIALED_REFRESH - 3) / 10) * 10
if ($want -lt 30) { throw 'Bildwiederholrate nicht erkannt' }
$files = @(Get-ChildItem -Path "$env:APPDATA\norisk\NoRiskClientV3\data\profiles\*\options.txt", "$env:APPDATA\.minecraft\options.txt" -ErrorAction SilentlyContinue)
if ($files.Count -eq 0) { throw 'Keine options.txt gefunden, Minecraft einmal starten' }
$prevFile = "$env:APPDATA\Dialed\mc-prev.json"
$prev = @{}
foreach ($f in $files) {
  $t = [IO.File]::ReadAllText($f.FullName)
  $prev[$f.FullName] = @{
    vsync = [regex]::Match($t, '(?m)^enableVsync:(\S+)').Groups[1].Value
    fps = [regex]::Match($t, '(?m)^maxFps:(\S+)').Groups[1].Value
  }
  foreach ($kv in @(@('enableVsync', 'false'), @('maxFps', "$want"))) {
    if ($t -match "(?m)^$($kv[0]):") { $t = [regex]::Replace($t, "(?m)^$($kv[0]):[^\r\n]*", "$($kv[0]):$($kv[1])") }
    else { $t = $t.TrimEnd() + "`n$($kv[0]):$($kv[1])`n" }
  }
  [IO.File]::WriteAllText($f.FullName, $t)
}
if (-not (Test-Path $prevFile)) {
  New-Item -ItemType Directory -Path "$env:APPDATA\Dialed" -Force | Out-Null
  $prev | ConvertTo-Json -Depth 3 | Set-Content -Path $prevFile -Encoding UTF8
}
'''
revert = '''
$prevFile = "$env:APPDATA\Dialed\mc-prev.json"
if (-not (Test-Path $prevFile)) { throw 'Vorher-Werte nicht gefunden, V-Sync und FPS bitte im Spiel einstellen' }
$prev = Get-Content -Path $prevFile -Raw | ConvertFrom-Json
foreach ($e in $prev.PSObject.Properties) {
  if (-not (Test-Path -LiteralPath $e.Name)) { continue }
  $t = [IO.File]::ReadAllText($e.Name)
  if ($e.Value.vsync) { $t = [regex]::Replace($t, '(?m)^enableVsync:[^\r\n]*', "enableVsync:$($e.Value.vsync)") }
  if ($e.Value.fps) { $t = [regex]::Replace($t, '(?m)^maxFps:[^\r\n]*', "maxFps:$($e.Value.fps)") }
  [IO.File]::WriteAllText($e.Name, $t)
}
Remove-Item $prevFile
'''

[[tweak]]
id = "mc.memory_check"
name = "Minecraft: Arbeitsspeicher sinnvoll"
category = "games"
kind = "check"
description = "Der NoRisk Client gibt Minecraft zwischen 2 und 10 GB Arbeitsspeicher. Zu wenig führt zu Rucklern beim Laden, zu viel verlängert die Pausen der Speicherbereinigung."
note = "Ändern im NoRisk Launcher unter Einstellungen. Für Vanilla und leichte Modpacks reichen 4 bis 6 GB."
evidence = "B"
risk = "low"
requires = ["minecraft"]
[[tweak.actions]]
type = "ps"
detect = '''
$f = "$env:APPDATA\norisk\NoRiskClientV3\launcher_config.json"
if (-not (Test-Path $f)) { 'NoRisk Client nicht gefunden' } else {
  $m = (Get-Content -LiteralPath $f -Raw | ConvertFrom-Json).global_memory_settings.max
  if (-not $m) { 'nicht lesbar' } elseif ($m -lt 2048) { "nur $m MB" } elseif ($m -gt 10240) { "$m MB, eher zu viel" } else { '1' }
}
'''
expect = "1"

[[tweak]]
id = "r6.fps_cap"
name = "Rainbow Six Siege: FPS-Limit 3 unter der Bildwiederholrate"
category = "games"
description = "Setzt FPSLimit in der GameSettings.ini aller Ubisoft-Konten auf die Bildwiederholrate minus 3. Ubisoft dokumentiert den Wert selbst, er senkt laut Ubisoft auch die CPU-Last. Mit G-SYNC oder FreeSync bleibt das Spiel so im VRR-Bereich."
note = "Rainbow Six vorher schließen."
evidence = "A"
risk = "low"
requires = ["r6"]
[[tweak.actions]]
type = "ps"
detect = '''
$root = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'My Games\Rainbow Six - Siege'
$files = @(Get-ChildItem -LiteralPath $root -Filter GameSettings.ini -Recurse -Depth 1 -ErrorAction SilentlyContinue)
$want = [int]$env:DIALED_REFRESH - 3
if ($files.Count -eq 0) { 'GameSettings.ini nicht gefunden' }
elseif (@($files | Where-Object { [IO.File]::ReadAllText($_.FullName) -notmatch "(?m)^FPSLimit=$want\r?$" }).Count -eq 0) { '1' } else { '0' }
'''
expect = "1"
apply = '''
$want = [int]$env:DIALED_REFRESH - 3
if ($want -lt 30) { throw 'Bildwiederholrate nicht erkannt' }
$root = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'My Games\Rainbow Six - Siege'
$files = @(Get-ChildItem -LiteralPath $root -Filter GameSettings.ini -Recurse -Depth 1 -ErrorAction SilentlyContinue)
if ($files.Count -eq 0) { throw 'GameSettings.ini nicht gefunden, Rainbow Six einmal starten' }
$prevFile = "$env:APPDATA\Dialed\r6-prev.json"
$prev = @{}
foreach ($f in $files) {
  $t = [IO.File]::ReadAllText($f.FullName)
  $m = [regex]::Match($t, '(?m)^FPSLimit=([^\r\n]*)')
  if (-not $m.Success) { throw "FPSLimit steht nicht in $($f.FullName)" }
  $prev[$f.FullName] = $m.Groups[1].Value
  [IO.File]::WriteAllText($f.FullName, [regex]::Replace($t, '(?m)^FPSLimit=[^\r\n]*', "FPSLimit=$want"))
}
if (-not (Test-Path $prevFile)) {
  New-Item -ItemType Directory -Path "$env:APPDATA\Dialed" -Force | Out-Null
  $prev | ConvertTo-Json | Set-Content -Path $prevFile -Encoding UTF8
}
'''
revert = '''
$prevFile = "$env:APPDATA\Dialed\r6-prev.json"
if (-not (Test-Path $prevFile)) { throw 'Vorher-Werte nicht gefunden, das Limit bitte im Spiel einstellen' }
$prev = Get-Content -Path $prevFile -Raw | ConvertFrom-Json
foreach ($e in $prev.PSObject.Properties) {
  if (-not (Test-Path -LiteralPath $e.Name)) { continue }
  $t = [IO.File]::ReadAllText($e.Name)
  [IO.File]::WriteAllText($e.Name, [regex]::Replace($t, '(?m)^FPSLimit=[^\r\n]*', "FPSLimit=$($e.Value)"))
}
Remove-Item $prevFile
'''

[[tweak]]
id = "ow.display_check"
name = "Overwatch 2: Bildwiederholrate passend"
category = "games"
kind = "check"
description = "Overwatch 2 läuft im Vollbild mit der höchsten Bildwiederholrate deines Hauptmonitors. Nach Updates fällt der Wert gern auf 60 Hz zurück und begrenzt dann auch die FPS."
note = "Ändern im Spiel unter Optionen → Video → Bildwiederholrate."
evidence = "B"
risk = "low"
requires = ["overwatch"]
[[tweak.actions]]
type = "ps"
detect = '''
$f = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Overwatch\Settings\Settings_v0.ini'
$m = Select-String -LiteralPath $f -Pattern '^\s*FullScreenRefresh\s*=\s*"?([\d.]+)' -ErrorAction SilentlyContinue | Select-Object -First 1
$d = @($env:DIALED_DISPLAYS | ConvertFrom-Json | ForEach-Object { $_ }) | Where-Object { $_.primary } | Select-Object -First 1
if (-not $m -or -not $d) { 'nicht lesbar' } else {
  $hz = [math]::Round([double]$m.Matches[0].Groups[1].Value)
  if ($hz -ge $d.max - 1) { '1' } else { "$hz statt $($d.max) Hz" }
}
'''
expect = "1"
