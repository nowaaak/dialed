[[tweak]]
id = "dotnet.ngen_flush"
name = ".NET-Optimierung nach Updates abschließen"
category = "windows"
kind = "oneshot"
description = "Nach .NET- und Windows-Updates übersetzt Windows im Hintergrund .NET-Bibliotheken neu (mscorsvw.exe). Das kann mitten im Spiel CPU-Last erzeugen. Diese Aktion erledigt die Warteschlange sofort."
note = "Dauert einige Minuten. Am besten direkt nach einem Patchday ausführen."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "ps"
apply = '''
$n = 0
foreach ($f in "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\ngen.exe", "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\ngen.exe") {
  if (Test-Path $f) { & $f executeQueuedItems | Out-Null; $n++ }
}
if ($n -eq 0) { throw '.NET Framework 4 nicht gefunden' }
'Ausstehende .NET-Optimierungen sind abgeschlossen.'
'''

[[tweak]]
id = "sec.exploit_protection_check"
name = "Exploit-Schutz (CFG und DEP) an"
category = "windows"
kind = "check"
description = "Kontrollflussschutz (CFG) und Datenausführungsverhinderung (DEP) sind systemweit nicht abgeschaltet. Manche Tweak-Pakete schalten sie ab, ohne gemessenen Gewinn. Valorant startet dann mit Fehler VAN 9002 nicht."
note = "Zurücksetzen unter Windows-Sicherheit → App- und Browsersteuerung → Exploit-Schutz → Systemeinstellungen auf „Standard verwenden“."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$m = Get-ProcessMitigation -System
$off = @()
if ("$($m.CFG.Enable)" -eq 'OFF') { $off += 'CFG' }
if ("$($m.DEP.Enable)" -eq 'OFF') { $off += 'DEP' }
if ($off.Count -eq 0) { '1' } else { 'systemweit aus: ' + ($off -join ', ') }
'''
expect = "1"

