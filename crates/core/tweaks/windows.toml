[[tweak]]
id = "sec.hvci_off"
name = "Speicherintegrität (HVCI) aus"
category = "windows"
description = "Schaltet die Kernisolierung ab. In CPU-limitierten Spielen der größte reine Windows-Hebel, Tests messen je nach System 3 bis 10 % mehr Leistung."
note = "Senkt den Kernel-Schutz. Valorant (Vanguard) und FACEIT können HVCI verlangen."
evidence = "A"
risk = "high"
reboot = true
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
name = "Enabled"
kind = "dword"
apply = 0
default = 1

[[tweak]]
id = "sec.vbs_off"
name = "Virtualisierungsbasierte Sicherheit (VBS) aus"
category = "windows"
description = "Startet Windows ohne Hypervisor. Geht über HVCI hinaus und entfernt den Virtualisierungs-Overhead komplett."
note = "WSL2, Docker Desktop, Hyper-V und die Windows-Sandbox funktionieren danach nicht mehr."
evidence = "B"
risk = "high"
reboot = true
[[tweak.actions]]
type = "bcd"
element = "hypervisorlaunchtype"
apply = "off"
default = "auto"
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SYSTEM\CurrentControlSet\Control\DeviceGuard'
name = "EnableVirtualizationBasedSecurity"
kind = "dword"
apply = 0

[[tweak]]
id = "mem.compression_off"
name = "Speicherkomprimierung aus"
category = "windows"
description = "Windows komprimiert selten genutzte Speicherseiten nicht mehr. Spart etwas CPU-Zeit bei Speicherdruck."
note = "Nur mit 32 GB RAM oder mehr sinnvoll, sonst wird früher ausgelagert."
evidence = "C"
risk = "medium"
reboot = true
[[tweak.actions]]
type = "ps"
detect = "(Get-MMAgent).MemoryCompression"
expect = "False"
apply = "Disable-MMAgent -MemoryCompression"
revert = "Enable-MMAgent -MemoryCompression"

[[tweak]]
id = "mem.purge_standby"
name = "RAM-Cache leeren (Standby-Liste)"
category = "windows"
description = "Leert einmalig die Standby-Liste. Hilft nur in dem seltenen Fall, dass ein Spiel bei vollem Standby-Cache ruckelt. Windows gibt diesen Speicher normalerweise selbst frei."
evidence = "C"
risk = "low"
kind = "oneshot"
[[tweak.actions]]
type = "ps"
apply = '''
$src = @"
using System;
using System.Runtime.InteropServices;
public static class DialedMem {
  [DllImport("ntdll.dll")] static extern int NtSetSystemInformation(int cls, ref int info, int len);
  [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr h, uint acc, out IntPtr tok);
  [DllImport("advapi32.dll", SetLastError=true, CharSet=CharSet.Unicode)] static extern bool LookupPrivilegeValue(string sys, string name, out long luid);
  [StructLayout(LayoutKind.Sequential, Pack=1)] struct TP { public int Count; public long Luid; public int Attr; }
  [DllImport("advapi32.dll", SetLastError=true)] static extern bool AdjustTokenPrivileges(IntPtr tok, bool dis, ref TP tp, int len, IntPtr prev, IntPtr ret);
  [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
  public static int Purge() {
    IntPtr tok;
    OpenProcessToken(GetCurrentProcess(), 0x28, out tok);
    TP tp = new TP(); tp.Count = 1; tp.Attr = 2;
    LookupPrivilegeValue(null, "SeProfileSingleProcessPrivilege", out tp.Luid);
    AdjustTokenPrivileges(tok, false, ref tp, 0, IntPtr.Zero, IntPtr.Zero);
    int cmd = 4; // MemoryPurgeStandbyList
    return NtSetSystemInformation(80, ref cmd, 4);
  }
}
"@
Add-Type -TypeDefinition $src
$status = [DialedMem]::Purge()
if ($status -ne 0) { throw ("NtSetSystemInformation meldet 0x{0:X8}" -f $status) }
"Standby-Liste geleert"
'''

[[tweak]]
id = "timer.service"
name = "Timer-Resolution-Dienst (0,5 ms)"
category = "windows"
description = "Startet bei der Anmeldung einen winzigen Hintergrundprozess von Dialed, der die Timer-Auflösung dauerhaft auf 0,5 ms hält. Erst zusammen mit „Globale Timer-Resolution“ wirkt das systemweit."
note = "Etwas höherer Stromverbrauch im Leerlauf. Nach einem Dialed-Update bleibt der Dienst bestehen."
evidence = "B"
risk = "low"
requires = ["win11"]
[[tweak.actions]]
type = "ps"
detect = '''
$t = Get-ScheduledTask -TaskName 'Dialed Timer Resolution'
# Nur aktiv, wenn die Aufgabe auf diese Dialed.exe zeigt (nicht auf einen alten Entwicklungs-Build)
if ($t -and $t.Actions[0].Execute -eq $env:DIALED_EXE) { '1' } else { '0' }
'''
expect = "1"
apply = '''
$exe = $env:DIALED_EXE
if (-not $exe -or -not (Test-Path $exe)) { throw 'Pfad zur Dialed.exe unbekannt' }
$a = New-ScheduledTaskAction -Execute $exe -Argument '--timer'
$t = New-ScheduledTaskTrigger -AtLogOn
$p = New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\$env:USERNAME" -RunLevel Highest -LogonType Interactive
$s = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero) -MultipleInstances IgnoreNew
Register-ScheduledTask -TaskName 'Dialed Timer Resolution' -Action $a -Trigger $t -Principal $p -Settings $s -Force | Out-Null
Start-ScheduledTask -TaskName 'Dialed Timer Resolution'
'''
revert = '''
Stop-ScheduledTask -TaskName 'Dialed Timer Resolution' -ErrorAction SilentlyContinue
Unregister-ScheduledTask -TaskName 'Dialed Timer Resolution' -Confirm:$false
'''

[[tweak]]
id = "win.windowed_optimizations"
name = "Optimierungen für Spiele im Fenstermodus"
category = "windows"
description = "DirectX-10- und DirectX-11-Spiele im Fenster oder randlosen Fenster nutzen das Flip-Modell statt des alten Kopiermodells. Laut Microsoft sinkt dadurch die Latenz deutlich, außerdem funktionieren dort VRR und Auto HDR."
note = "Wirkt ab dem nächsten Spielstart. Macht ein einzelnes Spiel Probleme, lässt es sich in den Windows-Grafikeinstellungen pro App ausnehmen."
evidence = "A"
risk = "low"
requires = ["win11"]
[[tweak.actions]]
type = "ps"
detect = '''
$v = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\DirectX\UserGpuPreferences' -Name DirectXUserGlobalSettings -ErrorAction SilentlyContinue).DirectXUserGlobalSettings
if ("$v" -match '(^|;)SwapEffectUpgradeEnable=1;') { '1' } else { '0' }
'''
expect = "1"
apply = '''
$k = 'HKCU:\Software\Microsoft\DirectX\UserGpuPreferences'
if (-not (Test-Path -LiteralPath $k)) { New-Item -Path $k | Out-Null }
$v = "$((Get-ItemProperty -LiteralPath $k -Name DirectXUserGlobalSettings -ErrorAction SilentlyContinue).DirectXUserGlobalSettings)"
$v = [regex]::Replace($v, '(^|;)SwapEffectUpgradeEnable=\d+;', '$1')
Set-ItemProperty -LiteralPath $k -Name DirectXUserGlobalSettings -Value ($v + 'SwapEffectUpgradeEnable=1;') -Type String
'''
revert = '''
$k = 'HKCU:\Software\Microsoft\DirectX\UserGpuPreferences'
$v = "$((Get-ItemProperty -LiteralPath $k -Name DirectXUserGlobalSettings -ErrorAction SilentlyContinue).DirectXUserGlobalSettings)"
$v = [regex]::Replace($v, '(^|;)SwapEffectUpgradeEnable=\d+;', '$1')
if ($v) { Set-ItemProperty -LiteralPath $k -Name DirectXUserGlobalSettings -Value $v -Type String }
else { Remove-ItemProperty -LiteralPath $k -Name DirectXUserGlobalSettings -ErrorAction SilentlyContinue }
'''

[[tweak]]
id = "wu.no_driver_updates"
