note = "Chipsatz-, WLAN- und andere Treiber musst du danach selbst aktuell halten. Windows zeigt in den Update-Einstellungen „Von deiner Organisation verwaltet“."
evidence = "A"
risk = "medium"
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
name = "ExcludeWUDriversInQualityUpdate"
kind = "dword"
apply = 1

[[tweak]]
id = "defender.low_cpu_scan"
name = "Defender-Scans mit niedriger CPU-Priorität"
category = "windows"
description = "Geplante Scans von Microsoft Defender laufen mit niedriger CPU-Priorität. Überschneidet sich ein Scan mit einem Spiel, nimmt er dem Spiel weniger Rechenzeit weg. Der Schutz bleibt gleich, Scans dauern nur länger."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$s = Get-MpComputerStatus -ErrorAction SilentlyContinue
if (-not $s -or $s.AMRunningMode -ne 'Normal') { 'Microsoft Defender ist nicht der aktive Virenschutz' }
elseif ((Get-MpPreference).EnableLowCpuPriority) { '1' } else { '0' }
'''
expect = "1"
apply = '''
Set-MpPreference -EnableLowCpuPriority $true
if (-not (Get-MpPreference).EnableLowCpuPriority) { throw 'Defender hat die Änderung nicht übernommen, eventuell blockiert der Manipulationsschutz' }
'''
revert = "Set-MpPreference -EnableLowCpuPriority $false"

