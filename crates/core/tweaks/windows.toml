# Windows: Timer, Scheduler, Eingabe, Sicherheit gegen Leistung

[[tweak]]
id = "kernel.global_timer_resolution"
name = "Globale Timer-Resolution (Windows 11)"
category = "windows"
description = "Timer-Resolution-Anfragen eines Prozesses gelten wieder systemweit, wie vor Windows 10 2004. Zusammen mit einem Spiel oder Tool, das 0,5 ms anfordert, werden Sleep-Aufrufe deutlich genauer."
evidence = "A"
risk = "low"
reboot = true
requires = ["win11"]
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
name = "GlobalTimerResolutionRequests"
kind = "dword"
apply = 1

[[tweak]]
id = "bcd.remove_useplatformclock"
name = "Erzwungenes HPET entfernen"
category = "windows"
description = "Entfernt useplatformclock aus dem Boot-Eintrag. Manche alten Guides erzwingen damit HPET als Zeitquelle, was jede Zeitabfrage teurer macht. Aktiv bedeutet: der Eintrag fehlt, so wie es sein soll."
evidence = "A"
risk = "low"
reboot = true
[[tweak.actions]]
type = "bcd"
element = "useplatformclock"

[[tweak]]
id = "bcd.disable_dynamic_tick"
name = "Dynamic Tick aus"
category = "windows"
description = "Der Systemtimer tickt durchgehend, statt im Leerlauf zu pausieren. Manche berichten von gleichmäßigeren Frametimes, andere von schlechterem Mausgefühl. Selbst testen."
