[[tweak]]
id = "cpu.boost_policy"
name = "CPU-Boost im Energieplan erlaubt"
category = "power"
kind = "check"
description = "Der aktive Energieplan erlaubt den Turbo-Takt und lässt die CPU bis 100 % laufen. Manche Pläne oder Tools schalten den Boost ab, dann fehlen schnell 20 % Takt."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
function AcIndex($sub, $set) {
  $h = @(powercfg /qh SCHEME_CURRENT $sub $set | Select-String '0x[0-9a-fA-F]{8}\s*$' | ForEach-Object { [Convert]::ToInt32(($_.Line -split '0x')[-1].Trim(), 16) })
  if ($h.Count -ge 2) { $h[$h.Count - 2] }
}
$boost = AcIndex 'SUB_PROCESSOR' 'PERFBOOSTMODE'
$max = AcIndex 'SUB_PROCESSOR' 'PROCTHROTTLEMAX'
