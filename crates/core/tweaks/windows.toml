note = "Senkt den Kernel-Schutz. Typisch sind etwa 5 % in CPU-limitierten Szenen, die 10 % sind der Ausreißer nach oben. Valorant (Vanguard) und FACEIT können HVCI verlangen. Seit Oktober 2026 schalten Windows-Updates HVCI auf geeigneten PCs ein, ausdrücklich abgeschaltete Werte bleiben laut Microsoft erhalten."
evidence = "A"
risk = "high"
reboot = true
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity'
name = "Enabled"
kind = "dword"
apply = 0
default = 1

