[[tweak]]
id = "win.fth_check"
name = "Kein Spiel unter Fault Tolerant Heap"
category = "windows"
kind = "check"
description = "Stürzt ein Programm mehrmals ab, legt Windows dauerhaft Speicherschutzmaßnahmen darüber (Fault Tolerant Heap). Das kann ein Spiel spürbar bremsen, auch wenn die Abstürze längst behoben sind."
note = "Zurücksetzen löscht die Einträge aller Programme: in einer Admin-Eingabeaufforderung rundll32.exe fthsvc.dll,FthSysprepSpecialize ausführen."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$games = 'FortniteClient-Win64-Shipping.exe', 'GTA5.exe', 'GTA5_Enhanced.exe', 'javaw.exe', 'cs2.exe', 'VALORANT-Win64-Shipping.exe', 'Among Us.exe', 'FiveM.exe'
$names = @((Get-Item -LiteralPath 'HKLM:\SOFTWARE\Microsoft\FTH\State' -ErrorAction SilentlyContinue).Property)
$hit = @($names | ForEach-Object { Split-Path $_ -Leaf } | Where-Object { $games -contains $_ } | Select-Object -Unique)
if ($hit.Count -eq 0) { '1' } else { 'betroffen: ' + ($hit -join ', ') }
'''
expect = "1"
