category = "windows"
description = "Kurze, variable Zeitscheiben mit 3:1-Vorteil für das Vordergrundfenster. Entspricht im Verhalten dem Windows-Standard (2), nur explizit gesetzt."
note = "Hex 0x26 = dezimal 38. Schließt sich mit 0x2A gegenseitig aus, es ist derselbe Registry-Wert."
