evidence = "C"
risk = "low"
reboot = true
requires = ["!laptop"]
[[tweak.actions]]
type = "bcd"
element = "disabledynamictick"
apply = "yes"

[[tweak]]
id = "prio.win32_2a"
name = "Win32PrioritySeparation 0x2A"
category = "windows"
description = "Kurze, feste Zeitscheiben mit 3:1-Vorteil für das Vordergrundfenster. Der unter Competitive-Spielern verbreitetste Wert."
note = "Hex 0x2A = dezimal 42. Die Quantum-Tabelle hat sich mit Windows 11 24H2 geändert, alte Messwerte sind nicht übertragbar."
evidence = "C"
risk = "low"
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SYSTEM\CurrentControlSet\Control\PriorityControl'
name = "Win32PrioritySeparation"
kind = "dword"
apply = "0x2A"
default = 2

[[tweak]]
id = "prio.win32_26"
