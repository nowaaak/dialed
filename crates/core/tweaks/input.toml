default = "31"

[[tweak]]
id = "input.device_power_off"
name = "Energiesparen für Eingabegeräte, USB und Netzwerk aus"
category = "input"
description = "Windows darf Maus, Tastatur, USB-Hubs, USB-Controller und die Netzwerkkarte nicht mehr zum Stromsparen abschalten. Verhindert Aussetzer und einen verzögerten ersten Tastendruck nach einer Pause."
note = "Entspricht dem Häkchen „Computer kann das Gerät ausschalten“ im Geräte-Manager. Nach dem Umstecken eines Geräts kann Windows es wieder setzen, Dialed zeigt das dann als Abweichung."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$ids = @(Get-PnpDevice -PresentOnly | Where-Object { $_.Class -in 'HIDClass', 'USB', 'Keyboard', 'Mouse', 'Net' } | ForEach-Object InstanceId)
$on = @(Get-CimInstance -Namespace root\wmi -ClassName MSPower_DeviceEnable | Where-Object { $_.Enable -and (($_.InstanceName -replace '_\d+$') -in $ids) })
if ($on.Count -eq 0) { '1' } else { "$($on.Count) Geräte dürfen abgeschaltet werden" }
'''
expect = "1"
apply = '''
$ids = @(Get-PnpDevice -PresentOnly | Where-Object { $_.Class -in 'HIDClass', 'USB', 'Keyboard', 'Mouse', 'Net' } | ForEach-Object InstanceId)
$all = @(Get-CimInstance -Namespace root\wmi -ClassName MSPower_DeviceEnable | Where-Object { ($_.InstanceName -replace '_\d+$') -in $ids })
$prev = "$env:APPDATA\Dialed\device-power-prev.json"
if (-not (Test-Path $prev)) {
  New-Item -ItemType Directory -Path "$env:APPDATA\Dialed" -Force | Out-Null
  ConvertTo-Json -InputObject @($all | Where-Object Enable | ForEach-Object InstanceName) | Set-Content -Path $prev -Encoding UTF8
}
foreach ($d in Get-WmiObject -Namespace root\wmi -Class MSPower_DeviceEnable | Where-Object { $_.Enable -and (($_.InstanceName -replace '_\d+$') -in $ids) }) { $d.Enable = $false; [void]$d.Put() }
'''
revert = '''
$prev = "$env:APPDATA\Dialed\device-power-prev.json"
if (-not (Test-Path $prev)) { throw 'Vorher-Zustand nicht gefunden, die Geräte bitte im Geräte-Manager einstellen' }
$names = @(Get-Content -Path $prev -Raw | ConvertFrom-Json)
foreach ($d in Get-WmiObject -Namespace root\wmi -Class MSPower_DeviceEnable | Where-Object { $_.InstanceName -in $names }) {
  $d.Enable = $true; [void]$d.Put()
}
Remove-Item $prev
'''

[[tweak]]
id = "input.background_mouse_throttle"
name = "Maus-Drossel für Hintergrund-Apps aktiv"
category = "input"
kind = "check"
description = "Windows 11 liefert Mausdaten an Apps im Hintergrund nur noch etwa 125-mal pro Sekunde. Das Spiel im Vordergrund bekommt weiter jede Abfrage der Maus, Hintergrund-Apps verbrauchen bei 4000- oder 8000-Hz-Mäusen aber deutlich weniger CPU."
note = "Manche Tweak-Tools schalten die Drossel ab oder setzen RawMouseThrottleDuration herunter. Für das Spiel im Vordergrund bringt das nichts, es kostet nur Rechenzeit. Zurück zum Standard: die Werte RawMouseThrottle* unter HKCU\\Control Panel\\Mouse löschen."
evidence = "B"
risk = "low"
requires = ["win11"]
[[tweak.actions]]
type = "ps"
detect = '''
$m = Get-ItemProperty -LiteralPath 'HKCU:\Control Panel\Mouse'
$off = ($null -ne $m.RawMouseThrottleEnabled -and [int]$m.RawMouseThrottleEnabled -eq 0)
$short = ($null -ne $m.RawMouseThrottleDuration -and [int]$m.RawMouseThrottleDuration -lt 8)
if ($off) { 'abgeschaltet' } elseif ($short) { "verkürzt auf $([int]$m.RawMouseThrottleDuration) ms" } else { '1' }
'''
expect = "1"

[[tweak]]
id = "audio.ducking_off"
name = "Automatisches Leiserstellen bei Anrufen aus"
category = "input"
description = "Windows senkt die Lautstärke aller anderen Programme um 80 %, sobald ein Programm als Kommunikation erkannt wird, etwa beim Voice-Chat. Danach bleibt das Spiel gleich laut."
note = "Entspricht in der Systemsteuerung Sound → Kommunikation → „Nichts unternehmen“."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "registry"
hive = "HKCU"
path = 'Software\Microsoft\Multimedia\Audio'
name = "UserDuckingPreference"
kind = "dword"
apply = 3

[[tweak]]
id = "audio.low_latency_service"
name = "Audio-Latenz-Dienst"
category = "input"
description = "Startet bei der Anmeldung einen kleinen Hintergrundprozess von Dialed, der beim Standard-Wiedergabegerät den kleinsten Audiopuffer anfordert, den der Treiber erlaubt. Laut Microsoft schalten dann alle Programme auf diesem Gerät auf den kleineren Puffer um, Spiele eingeschlossen. Windows nutzt sonst 10 ms."
note = "Wirkt nur, wenn der Treiber kleinere Puffer anbietet. Unter hoher CPU-Last sind Knackser möglich, dann ausschalten. Der Dienst erscheint als Dialed im Lautstärkemixer und kann den automatischen Standby verhindern."
evidence = "A"
risk = "medium"
requires = ["desktop"]
[[tweak.actions]]
type = "ps"
detect = '''
$t = Get-ScheduledTask -TaskName 'Dialed Audio Latency'
if ($t -and $t.Actions[0].Execute -eq $env:DIALED_EXE) { '1' } else { '0' }
'''
expect = "1"
apply = '''
$exe = $env:DIALED_EXE
if (-not $exe -or -not (Test-Path $exe)) { throw 'Pfad zur Dialed.exe unbekannt' }
$a = New-ScheduledTaskAction -Execute $exe -Argument '--audio'
$t = New-ScheduledTaskTrigger -AtLogOn -User "$env:USERDOMAIN\$env:USERNAME"
$p = New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\$env:USERNAME" -RunLevel Highest -LogonType Interactive
$s = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero) -MultipleInstances IgnoreNew
Register-ScheduledTask -TaskName 'Dialed Audio Latency' -Action $a -Trigger $t -Principal $p -Settings $s -Force | Out-Null
Start-ScheduledTask -TaskName 'Dialed Audio Latency'
'''
revert = '''
Stop-ScheduledTask -TaskName 'Dialed Audio Latency' -ErrorAction SilentlyContinue
Unregister-ScheduledTask -TaskName 'Dialed Audio Latency' -Confirm:$false
Get-CimInstance Win32_Process -Filter "Name = 'dialed.exe'" | Where-Object { $_.CommandLine -like '*--audio*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
'''

[[tweak]]
id = "input.usb_irq_affinity"
name = "USB-Interrupts weg von CPU 0"
category = "input"
description = "Legt die Interrupts der USB-Controller fest auf den logischen Kern 4. Maus und Tastatur konkurrieren dort nicht mit den Treibern, die Windows standardmäßig auf CPU 0 bündelt, und nicht mit der GPU, falls „GPU-Interrupts weg von CPU 0“ aktiv ist."
note = "Wirkung hängt stark vom System ab und sollte mit dem Benchmark geprüft werden. Reagieren Maus oder Tastatur nach dem Neustart nicht richtig, zurücksetzen."
evidence = "C"
risk = "medium"
reboot = true
[[tweak.actions]]
type = "ps"
detect = '''
$n = 0; $ok = $true
foreach ($d in (Get-PnpDevice -Class USB -PresentOnly | Where-Object { $_.InstanceId -like 'PCI\*' })) {
  $n++
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($d.InstanceId)\Device Parameters\Interrupt Management\Affinity Policy"
  if ((Get-ItemProperty $k -ErrorAction SilentlyContinue).DevicePolicy -ne 4) { $ok = $false }
}
if ($n -gt 0 -and $ok) { '1' } else { '0' }
'''
expect = "1"
apply = '''
if ([Environment]::ProcessorCount -lt 6) { throw 'Braucht mindestens 6 logische Kerne' }
foreach ($d in (Get-PnpDevice -Class USB -PresentOnly | Where-Object { $_.InstanceId -like 'PCI\*' })) {
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($d.InstanceId)\Device Parameters\Interrupt Management\Affinity Policy"
  New-Item -Path $k -Force | Out-Null
  Set-ItemProperty -Path $k -Name DevicePolicy -Value 4 -Type DWord
  Set-ItemProperty -Path $k -Name AssignmentSetOverride -Value ([byte[]](0x10)) -Type Binary
}
'''
revert = '''
foreach ($d in (Get-PnpDevice -Class USB -PresentOnly | Where-Object { $_.InstanceId -like 'PCI\*' })) {
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($d.InstanceId)\Device Parameters\Interrupt Management\Affinity Policy"
  Remove-ItemProperty -Path $k -Name DevicePolicy, AssignmentSetOverride -ErrorAction SilentlyContinue
}
'''

[[tweak]]
id = "audio.bluetooth_output_check"
name = "Spielton nicht über Bluetooth"
category = "input"
kind = "check"
description = "Das Standard-Wiedergabegerät ist nicht per Bluetooth verbunden. Bluetooth-Kopfhörer bringen je nach Modell 100 bis 300 ms Verzögerung mit, ein Funk-Dongle oder Kabel liegt bei wenigen Millisekunden."
note = "Bei Headsets mit 2,4-GHz-Dongle den Dongle nutzen und ihn in den Sound-Einstellungen als Standardgerät wählen."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$a = $env:DIALED_AUDIO | ConvertFrom-Json
if (-not $a) { 'kein Wiedergabegerät erkannt' } elseif ("$($a.bus)" -like 'BTH*') { "$($a.name) läuft über Bluetooth" } else { '1' }
'''
expect = "1"

[[tweak]]
id = "audio.bluetooth_mic_check"
name = "Mikrofon nicht über Bluetooth"
category = "input"
kind = "check"
description = "Das Standard- und das Kommunikationsmikrofon laufen nicht über klassisches Bluetooth. Öffnet eine App ein Bluetooth-Mikrofon, schaltet Windows das Headset ins Freisprechprofil: Ton nur noch in Mono mit niedriger Abtastrate, alles klingt dumpf, auch das Spiel."
note = "Bei Headsets mit 2,4-GHz-Dongle den Dongle für Ton und Mikrofon nutzen. Sonst ein anderes Mikrofon als Standard setzen und das Bluetooth-Mikrofon in den Sound-Einstellungen deaktivieren. Nur LE-Audio-Headsets an einem LE-Audio-fähigen PC schaffen Stereo und Mikrofon gleichzeitig."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$a = $env:DIALED_AUDIO | ConvertFrom-Json
$bt = @()
if ($a -and "$($a.mic_bus)" -like 'BTH*') { $bt += $a.mic_name }
if ($a -and "$($a.comm_mic_bus)" -like 'BTH*' -and $a.comm_mic_name -ne $a.mic_name) { $bt += $a.comm_mic_name }
if ($bt.Count -eq 0) { '1' } else { 'Bluetooth-Mikrofon als Standard: ' + ($bt -join ', ') }
'''
expect = "1"

[[tweak]]
id = "audio.comm_device_check"
name = "Sprachchat auf demselben Gerät"
category = "input"
kind = "check"
description = "Das Standardgerät für Kommunikation ist dasselbe wie für Spiele. Sonst geben Programme wie Discord, die dem Kommunikationsgerät folgen, den Sprachchat auf einem anderen Gerät aus, etwa über die Lautsprecher des Monitors."
note = "Ändern in der Systemsteuerung unter Sound → Wiedergabe → Rechtsklick auf das Headset → „Als Standardkommunikationsgerät festlegen“."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$a = $env:DIALED_AUDIO | ConvertFrom-Json
if (-not $a -or -not $a.comm_name) { '1' } else { "Kommunikation läuft über $($a.comm_name)" }
'''
expect = "1"

[[tweak]]
id = "audio.small_buffer_check"
name = "Kleiner Audiopuffer möglich"
category = "input"
kind = "check"
description = "Der Treiber des Standard-Wiedergabegeräts erlaubt einen kleineren Puffer als die üblichen 10 ms. Nur dann wirkt der Audio-Latenz-Dienst."
note = "Bluetooth- und HDMI-Ausgänge erlauben meist nur 10 ms. Virtuelle Geräte wie SteelSeries Sonar oder USB-Headsets mit dem Windows-Treiber oft weniger."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$a = $env:DIALED_AUDIO | ConvertFrom-Json
if (-not $a -or -not $a.default_ms) { 'nicht lesbar' } elseif ($a.min_ms -lt $a.default_ms) { '1' } else { "$($a.name) erlaubt nur $($a.default_ms) ms" }
'''
expect = "1"
