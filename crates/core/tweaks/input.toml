[[tweak]]
id = "input.accessibility_hotkeys_off"
name = "Tastenkürzel der Bedienungshilfen aus"
category = "input"
description = "Fünfmal Shift, achtmal langes Shift und fünf Sekunden Num-Taste öffnen keine Abfrage für Einrastfunktion, Anschlagverzögerung und Statusanzeige mehr. Die Abfrage holt mitten im Spiel den Desktop nach vorn."
note = "Wirkt nach der nächsten Anmeldung. Die Funktionen selbst bleiben in den Einstellungen unter Barrierefreiheit verfügbar."
evidence = "A"
risk = "low"
reboot = true
[[tweak.actions]]
type = "registry"
hive = "HKCU"
path = 'Control Panel\Accessibility\StickyKeys'
name = "Flags"
kind = "sz"
apply = "506"
default = "510"
[[tweak.actions]]
type = "registry"
hive = "HKCU"
path = 'Control Panel\Accessibility\Keyboard Response'
name = "Flags"
kind = "sz"
apply = "122"
default = "126"
[[tweak.actions]]
type = "registry"
hive = "HKCU"
path = 'Control Panel\Accessibility\ToggleKeys'
name = "Flags"
kind = "sz"
apply = "58"
default = "62"

[[tweak]]
id = "input.filterkeys_check"
name = "Anschlagverzögerung aus"
category = "input"
kind = "check"
description = "Ist die Anschlagverzögerung (FilterKeys) an, nimmt Windows Tastendrücke absichtlich erst nach einer Wartezeit an und ignoriert schnelle Wiederholungen."
note = "Ausschalten unter Einstellungen → Barrierefreiheit → Tastatur → Anschlagverzögerung."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$f = (Get-ItemProperty -LiteralPath 'HKCU:\Control Panel\Accessibility\Keyboard Response').Flags
if (([int]$f -band 1) -eq 0) { '1' } else { '0' }
'''
expect = "1"

[[tweak]]
id = "input.keyboard_repeat"
name = "Schnelle Tastenwiederholung"
category = "input"
