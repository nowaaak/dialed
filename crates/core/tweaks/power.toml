# Energie: Energieplan, Parking, Schnellstart

[[tweak]]
id = "power.dialed_plan"
name = "Dialed-Energieplan"
category = "power"
description = "Eigener Energieplan für hohe FPS und niedrige Latenz bei normalen Temperaturen: aggressiver Boost, Energiepräferenz auf Leistung, USB-, PCIe-, NVMe- und SATA-Stromsparen aus. Der minimale Takt bleibt bei 5 % und die C-States bleiben an, damit die CPU im Leerlauf kühl bleibt."
note = "Basiert auf „Höchstleistung“, auf Geräten ohne diesen Plan auf „Ausbalanciert“. Zurücksetzen aktiviert den vorherigen Plan und löscht den Dialed-Plan."
evidence = "B"
risk = "low"
requires = ["!x3d_dual_ccd"]
[[tweak.actions]]
type = "ps"
detect = "if ((powercfg /getactivescheme) -match 'd1a1ed00-0000-4000-8000-000000000001') { '1' } else { '0' }"
expect = "1"
apply = '''
$g = 'd1a1ed00-0000-4000-8000-000000000001'
$re = '[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}'
if ("$(powercfg /getactivescheme)" -match $re) {
  if ($Matches[0] -ne $g) { Set-Content -Path "$env:APPDATA\Dialed\prev-scheme.txt" -Value $Matches[0] }
}
if (-not ("$(powercfg /list)" -match $g)) {
  powercfg -duplicatescheme 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c $g | Out-Null
  if ($LASTEXITCODE -ne 0) { powercfg -duplicatescheme 381b4222-f694-41f0-9685-ff5bb260df2e $g | Out-Null }
}
powercfg -changename $g 'Dialed' 'Hohe FPS, niedrige Latenz, normale Temperaturen'
$p = '54533251-82be-4824-96c1-47b60b740d00'
powercfg -setacvalueindex $g $p 893dee8e-2bef-41e0-89c6-b55d0929964c 5    | Out-Null  # minimaler Takt 5 %
powercfg -setacvalueindex $g $p bc5038f7-23e0-4960-96da-33abaf5935ec 100  | Out-Null  # maximaler Takt 100 %
powercfg -setacvalueindex $g $p be337238-0d82-4146-a960-4f3749d470c7 2    | Out-Null  # Boost: aggressiv
powercfg -setacvalueindex $g $p 36687f9e-e3a5-4dbf-b1dc-15eb381c6863 0    | Out-Null  # Energiepräferenz: Leistung
powercfg -setacvalueindex $g $p 5d76a2ca-e8c0-402f-a133-2158492d58ad 0    | Out-Null  # C-States bleiben an
powercfg -setacvalueindex $g 2a737441-1930-4402-8d77-b2bebba308a3 48e6b7a6-50f5-4782-a5d4-53bb8f07e226 0 | Out-Null  # USB Selective Suspend aus
powercfg -setacvalueindex $g 501a4d13-42af-4429-9fd1-a8218c268e20 ee12f906-d277-404b-b6da-e5fa1a576df5 0 | Out-Null  # PCIe ASPM aus
powercfg -setacvalueindex $g 0012ee47-9041-4b5d-9b77-535fba8b1442 fc95af4d-40e7-4b6d-835a-56d131dbc80e 0 | Out-Null
powercfg -setacvalueindex $g 0012ee47-9041-4b5d-9b77-535fba8b1442 dbc9e238-6de9-49e3-92cd-8c2b4946b472 0 | Out-Null
powercfg -setacvalueindex $g 0012ee47-9041-4b5d-9b77-535fba8b1442 0b2d69d7-a2a1-449c-9680-f91c70521c60 0 | Out-Null
powercfg -setacvalueindex $g 0012ee47-9041-4b5d-9b77-535fba8b1442 dab60367-53fe-4fbc-825e-521d069d2456 0 | Out-Null
powercfg -setactive $g
if ($LASTEXITCODE -ne 0) { throw 'Energieplan konnte nicht aktiviert werden' }
'''
revert = '''
$g = 'd1a1ed00-0000-4000-8000-000000000001'
$prev = '381b4222-f694-41f0-9685-ff5bb260df2e'
$file = "$env:APPDATA\Dialed\prev-scheme.txt"
if (Test-Path $file) { $saved = (Get-Content $file -Raw).Trim(); if ("$(powercfg /list)" -match $saved) { $prev = $saved } }
powercfg -setactive $prev
powercfg -delete $g
'''

[[tweak]]
id = "power.core_parking_off"
name = "Core Parking aus"
category = "power"
description = "Windows parkt im aktiven Energieplan keine Kerne mehr. Vermeidet Aufwachverzögerungen beim Lastwechsel."
note = "Auf Intel-CPUs mit E-Kernen den Standard lassen, dort stört es den Thread Director."
evidence = "B"
risk = "low"
requires = ["!x3d_dual_ccd"]
[[tweak.actions]]
type = "powercfg"
sub = "54533251-82be-4824-96c1-47b60b740d00"
setting = "0cc5b647-c1df-4637-891a-dec35c318583"
apply = 100

[[tweak]]
id = "power.usb_suspend_off"
name = "USB Selective Suspend aus"
category = "power"
description = "USB-Geräte werden im aktiven Energieplan nicht mehr schlafen gelegt. Hilft gegen Aussetzer von Maus, Tastatur und Headset, nicht für FPS."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "powercfg"
sub = "2a737441-1930-4402-8d77-b2bebba308a3"
setting = "48e6b7a6-50f5-4782-a5d4-53bb8f07e226"
apply = 0
default = 1

[[tweak]]
id = "power.pcie_aspm_off"
name = "PCIe-Energiesparen (ASPM) aus"
category = "power"
description = "PCIe-Verbindungen zu GPU, NVMe und Netzwerkkarte bleiben voll aktiv. Vermeidet Aufwach-Latenzen."
note = "Kostet am Notebook Akkulaufzeit."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "powercfg"
sub = "501a4d13-42af-4429-9fd1-a8218c268e20"
setting = "ee12f906-d277-404b-b6da-e5fa1a576df5"
apply = 0

[[tweak]]
id = "power.fast_startup_off"
name = "Schnellstart aus"
category = "power"
description = "Herunterfahren ist wieder ein echter Kaltstart. Treiber und Kernel werden bei jedem Start frisch geladen, was Fehler nach Treiber-Updates und BIOS-Änderungen vermeidet."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "registry"
hive = "HKLM"
path = 'SYSTEM\CurrentControlSet\Control\Session Manager\Power'
name = "HiberbootEnabled"
kind = "dword"
apply = 0
default = 1

[[tweak]]
id = "power.hibernate_off"
name = "Ruhezustand aus"
category = "power"
description = "Deaktiviert den Ruhezustand und löscht hiberfil.sys. Gibt Speicherplatz in Höhe eines großen Teils des RAMs frei."
note = "Auf Notebooks geht damit der Schutz bei leerem Akku verloren."
evidence = "B"
risk = "low"
requires = ["!laptop"]
[[tweak.actions]]
type = "ps"
detect = "[int](Get-ItemProperty 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Power').HibernateEnabled"
expect = "0"
apply = "powercfg /h off"
revert = "powercfg /h on"
