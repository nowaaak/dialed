# Grafik

[[tweak]]
id = "gpu.msi_mode"
name = "MSI-Mode für die Grafikkarte"
category = "gpu"
description = "Die Grafikkarte nutzt Message Signaled Interrupts statt klassischer Leitungs-Interrupts. Senkt die Interrupt-Latenz, NVIDIA-Treiber lassen das oft aus."
note = "Betrifft alle Grafikadapter im System. Startet ein Gerät danach nicht, im abgesicherten Modus zurücksetzen."
evidence = "B"
risk = "medium"
reboot = true
[[tweak.actions]]
type = "device_registry"
class_guid = "{4d36e968-e325-11ce-bfc1-08002be10318}"
subpath = 'Device Parameters\Interrupt Management\MessageSignaledInterruptProperties'
name = "MSISupported"
apply = 1

[[tweak]]
id = "gpu.nvidia_telemetry_tasks"
name = "NVIDIA-Telemetrie-Aufgaben aus"
category = "gpu"
description = "Deaktiviert die geplanten NVIDIA-Aufgaben für Telemetrie und Fehlerberichte (NvTm…). Weniger Hintergrundaktivität, kein FPS-Wunder."
evidence = "B"
risk = "low"
requires = ["gpu.nvidia"]
[[tweak.actions]]
type = "ps"
detect = "@(Get-ScheduledTask -TaskName 'NvTm*' | Where-Object { $_.State -ne 'Disabled' }).Count"
expect = "0"
apply = "Get-ScheduledTask -TaskName 'NvTm*' -ErrorAction SilentlyContinue | Disable-ScheduledTask | Out-Null"
revert = "Get-ScheduledTask -TaskName 'NvTm*' -ErrorAction SilentlyContinue | Enable-ScheduledTask | Out-Null"

[[tweak]]
id = "gpu.irq_affinity"
name = "GPU-Interrupts weg von CPU 0"
category = "gpu"
description = "Legt die Interrupts der Grafikkarte fest auf den logischen Kern 2. Auf CPU 0 landen standardmäßig die meisten Treiber-Interrupts, dort konkurriert die GPU sonst mit Maus, Netzwerk und Audio."
note = "Wirkung hängt stark vom System ab und sollte mit dem Benchmark geprüft werden."
evidence = "C"
risk = "medium"
reboot = true
[[tweak.actions]]
type = "ps"
detect = '''
$n = 0; $ok = $true
foreach ($d in (Get-PnpDevice -Class Display -PresentOnly | Where-Object { $_.InstanceId -like 'PCI\*' })) {
  $n++
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($d.InstanceId)\Device Parameters\Interrupt Management\Affinity Policy"
  if ((Get-ItemProperty $k -ErrorAction SilentlyContinue).DevicePolicy -ne 4) { $ok = $false }
}
if ($n -gt 0 -and $ok) { '1' } else { '0' }
'''
expect = "1"
apply = '''
if ([Environment]::ProcessorCount -lt 4) { throw 'Braucht mindestens 4 logische Kerne' }
foreach ($d in (Get-PnpDevice -Class Display -PresentOnly | Where-Object { $_.InstanceId -like 'PCI\*' })) {
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($d.InstanceId)\Device Parameters\Interrupt Management\Affinity Policy"
  New-Item -Path $k -Force | Out-Null
  Set-ItemProperty -Path $k -Name DevicePolicy -Value 4 -Type DWord
  Set-ItemProperty -Path $k -Name AssignmentSetOverride -Value ([byte[]](0x04)) -Type Binary
}
'''
revert = '''
foreach ($d in (Get-PnpDevice -Class Display -PresentOnly | Where-Object { $_.InstanceId -like 'PCI\*' })) {
  $k = "HKLM:\SYSTEM\CurrentControlSet\Enum\$($d.InstanceId)\Device Parameters\Interrupt Management\Affinity Policy"
  Remove-ItemProperty -Path $k -Name DevicePolicy, AssignmentSetOverride -ErrorAction SilentlyContinue
}
'''

# NVIDIA-Treiberprofil (global). Kennungen aus NVIDIAs öffentlichem Header NvApiDriverSettings.h.

[[tweak]]
id = "nv.power_max"
name = "NVIDIA: Energieverwaltung auf maximale Leistung"
category = "gpu"
description = "Die Grafikkarte taktet unter Last nicht mehr herunter. Vermeidet Frametime-Spitzen, wenn die GPU-Auslastung schwankt, etwa in Esport-Titeln mit FPS-Limit."
note = "Gilt global für alle Programme. Die Karte verbraucht im Leerlauf etwas mehr. Spiele nach dem Umschalten neu starten."
evidence = "B"
risk = "low"
requires = ["gpu.nvidia"]
[[tweak.actions]]
type = "nvidia_drs"
setting = "0x1057EB71"
apply = 1

[[tweak]]
id = "nv.prerender_1"
name = "NVIDIA: Modus für geringe Latenz Ein"
category = "gpu"
description = "Begrenzt die vorgerenderten Frames auf 1. Senkt die Eingabeverzögerung in Spielen ohne NVIDIA Reflex, wenn die GPU am Limit läuft."
note = "In Spielen mit Reflex (auch Fortnite) übernimmt Reflex diese Aufgabe, dort ändert der Schalter nichts."
evidence = "B"
risk = "low"
requires = ["gpu.nvidia"]
[[tweak.actions]]
type = "nvidia_drs"
setting = "0x007BA09E"
apply = 1

[[tweak]]
id = "nv.shader_cache_unlimited"
name = "NVIDIA: Shader-Cache unbegrenzt"
category = "gpu"
description = "Hebt die Größenbegrenzung des Shader-Caches auf. Verhindert, dass der Treiber kompilierte Shader verwirft und Spiele sie mit Rucklern neu kompilieren."
note = "Der Cache kann über die Zeit mehrere Gigabyte belegen."
evidence = "B"
risk = "low"
requires = ["gpu.nvidia"]
[[tweak.actions]]
type = "nvidia_drs"
setting = "0x00AC8497"
apply = "0xFFFFFFFF"

[[tweak]]
id = "nv.refresh_highest"
name = "NVIDIA: Bevorzugte Bildwiederholrate höchste verfügbare"
category = "gpu"
description = "Spiele im exklusiven Vollbild, die selbst 60 Hz anfordern, laufen mit der höchsten Bildwiederholrate des Monitors. Betrifft vor allem ältere DirectX-9- und DirectX-11-Spiele."
note = "Ohne Wirkung im randlosen Fenster."
evidence = "B"
risk = "low"
requires = ["gpu.nvidia"]
[[tweak.actions]]
type = "nvidia_drs"
setting = "0x0064B541"
apply = 1

[[tweak]]
id = "display.refresh_check"
name = "Monitore mit höchster Bildwiederholrate"
category = "gpu"
kind = "check"
description = "Jeder Monitor läuft in Windows mit der höchsten Bildwiederholrate, die er bei der eingestellten Auflösung kann. Nach Treiber-Updates oder neuen Kabeln steht er oft wieder auf 60 Hz."
note = "Ändern unter Einstellungen → System → Anzeige → Erweiterte Anzeige."
evidence = "A"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$d = @($env:DIALED_DISPLAYS | ConvertFrom-Json | ForEach-Object { $_ })
$low = @($d | Where-Object { $_.current -lt $_.max })
if ($d.Count -eq 0) { 'keine Monitore erkannt' } elseif ($low.Count -eq 0) { '1' } else { ($low | ForEach-Object { "$($_.name) läuft mit $($_.current) statt $($_.max) Hz" }) -join ', ' }
'''
expect = "1"

[[tweak]]
id = "gfx.mpo_check"
name = "Multiplane Overlay nicht abgeschaltet"
category = "gpu"
kind = "check"
description = "Viele Guides schalten Multiplane Overlay (MPO) ab. Das hilft nur gegen Flackern auf bestimmten Systemen. Ohne MPO verlieren randlose Spiele den Ausgabeweg „Hardware Composed: Independent Flip“, der greift, wenn Overlays wie Discord oder die Lautstärkeanzeige über dem Spiel liegen."
note = "Ist MPO absichtlich wegen Flackern aus, kannst du diese Prüfung ignorieren. Sonst den Wert OverlayTestMode unter HKLM\\SOFTWARE\\Microsoft\\Windows\\Dwm löschen und neu starten."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = "if ((Get-ItemProperty -LiteralPath 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\Dwm' -Name OverlayTestMode -ErrorAction SilentlyContinue).OverlayTestMode -eq 5) { '0' } else { '1' }"
expect = "1"

[[tweak]]
id = "gpu.rebar_check"
name = "Resizable BAR aktiv"
category = "gpu"
kind = "check"
description = "Die CPU kann den gesamten Grafikspeicher auf einmal ansprechen. NVIDIA nutzt das in Spielen, für die es getestet ist."
note = "Einschalten im BIOS: „Above 4G Decoding“ und „Re-Size BAR Support“ an, CSM aus."
evidence = "A"
risk = "low"
requires = ["gpu.nvidia"]
[[tweak.actions]]
type = "ps"
detect = '''
if (-not (Get-Command nvidia-smi -ErrorAction SilentlyContinue)) { 'nvidia-smi nicht gefunden' } else {
  $q = (& nvidia-smi -q -d MEMORY) -join "`n"
  $fb = [regex]::Match($q, 'FB Memory Usage\s+Total\s+:\s+(\d+)').Groups[1].Value
  $bar = [regex]::Match($q, 'BAR1 Memory Usage\s+Total\s+:\s+(\d+)').Groups[1].Value
  if (-not $fb -or -not $bar) { 'nicht lesbar' } elseif ([int]$bar -ge [int]$fb) { '1' } else { "BAR1 nur $bar MiB" }
}
'''
expect = "1"

[[tweak]]
id = "gpu.pcie_check"
name = "Grafikkarte mit voller PCIe-Anbindung"
category = "gpu"
kind = "check"
description = "Die Grafikkarte läuft mit allen Lanes und der höchsten PCIe-Generation, die Karte und Mainboard gemeinsam können. Ein falscher Steckplatz oder eine BIOS-Einstellung halbiert sonst die Bandbreite."
note = "Steckt die Karte im obersten langen Steckplatz? Im BIOS die PCIe-Generation auf Auto stellen."
evidence = "A"
risk = "low"
requires = ["gpu.nvidia"]
[[tweak.actions]]
type = "ps"
detect = '''
if (-not (Get-Command nvidia-smi -ErrorAction SilentlyContinue)) { 'nvidia-smi nicht gefunden' } else {
  $v = ((& nvidia-smi --query-gpu=pcie.link.gen.max,pcie.link.gen.gpumax,pcie.link.gen.hostmax,pcie.link.width.current,pcie.link.width.max --format=csv,noheader,nounits) | Select-Object -First 1) -split ',\s*'
  $p = @()
  if ([int]$v[3] -lt [int]$v[4]) { $p += "x$($v[3]) statt x$($v[4])" }
  if ([int]$v[0] -lt [math]::Min([int]$v[1], [int]$v[2])) { $p += "PCIe $($v[0]).0 statt $([math]::Min([int]$v[1], [int]$v[2])).0" }
  if ($p.Count -eq 0) { '1' } else { $p -join ', ' }
}
'''
expect = "1"

[[tweak]]
id = "gpu.vrr_check"
name = "G-SYNC aktiv"
category = "gpu"
kind = "check"
description = "Der NVIDIA-Treiber meldet für mindestens einen Monitor G-SYNC oder G-SYNC Compatible als möglich und eingeschaltet. Erst dann erscheinen die G-SYNC-Einstellungen von Dialed."
note = "Einschalten in der NVIDIA-Systemsteuerung → Anzeige → G-SYNC einrichten. Bei FreeSync-Monitoren vorher FreeSync im Monitormenü aktivieren."
evidence = "A"
risk = "low"
requires = ["gpu.nvidia"]
[[tweak.actions]]
type = "ps"
detect = "if ($env:DIALED_VRR -eq '1') { '1' } else { '0' }"
expect = "1"

[[tweak]]
id = "nv.gsync_vsync"
name = "G-SYNC: V-Sync im Treiber an"
category = "gpu"
description = "Teil des Setups nach Blur Busters: Mit G-SYNC verhindert V-Sync im Treiber Tearing an der Obergrenze und bei Frametime-Spitzen, ohne die klassische V-Sync-Verzögerung, solange die FPS unter der Bildwiederholrate bleiben. V-Sync im Spiel bleibt aus."
note = "Gehört mit „G-SYNC: FPS-Limit 3 unter der Bildwiederholrate“ zusammen."
evidence = "A"
risk = "low"
requires = ["gpu.nvidia", "vrr"]
[[tweak.actions]]
type = "nvidia_drs"
setting = "0x00A879CF"
apply = "0x47814940"

[[tweak]]
id = "nv.gsync_fps_cap"
name = "G-SYNC: FPS-Limit 3 unter der Bildwiederholrate"
category = "gpu"
description = "Setzt im NVIDIA-Treiber ein globales FPS-Limit knapp unter der Bildwiederholrate. Damit bleibt jedes Spiel im G-SYNC-Bereich und V-Sync greift nie mit voller Verzögerung."
note = "Ein Limit im Spiel ist etwas direkter. Spiele mit Reflex begrenzen ohnehin selbst etwas tiefer. Das niedrigere Limit gewinnt."
evidence = "A"
risk = "low"
requires = ["gpu.nvidia", "vrr"]
[[tweak.actions]]
type = "nvidia_drs"
setting = "0x10835002"
apply = "refresh-3"

[[tweak]]
id = "nv.gsync_indicator"
name = "G-SYNC: Anzeige im Spiel"
category = "gpu"
description = "Der Treiber blendet ein kleines G-SYNC-Symbol ein, solange G-SYNC tatsächlich greift. Praktisch, um das Setup zu prüfen."
evidence = "A"
risk = "low"
requires = ["gpu.nvidia", "vrr"]
[[tweak.actions]]
type = "nvidia_drs"
setting = "0x1095F16F"
apply = 1

[[tweak]]
id = "gpu.driver_check"
name = "Grafiktreiber installiert und aktuell"
category = "gpu"
kind = "check"
description = "Ein richtiger Grafiktreiber ist installiert und höchstens ein Jahr alt. Bei NVIDIA mindestens Version 581.94: Ältere Treiber verloren nach dem Windows-Update KB5066835 teils massiv Leistung."
note = "Neue Treiber über die NVIDIA App, AMD Adrenalin oder Intel holen. Der neueste Treiber bringt nicht automatisch mehr FPS, behebt aber Fehler mit neuen Spielen und Windows-Updates."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "ps"
detect = '''
$g = @(Get-CimInstance Win32_VideoController)
$p = @()
if ($g | Where-Object { $_.Name -match 'Basic Display|Standard-VGA|Microsoft Basic' }) { $p += 'kein richtiger Grafiktreiber' }
foreach ($x in $g | Where-Object { $_.Name -match 'NVIDIA' }) {
  $d = "$($x.DriverVersion)".Replace('.', '')
  if ($d.Length -ge 5) {
    $v = [int]$d.Substring($d.Length - 5)
    if ($v -lt 58194) { $p += 'NVIDIA-Treiber {0}.{1:00} ist älter als 581.94' -f [math]::Floor($v / 100), ($v % 100) }
  }
}
$old = @($g | Where-Object { $_.DriverDate -and $_.DriverDate -lt (Get-Date).AddDays(-365) })
if ($old.Count) { $p += 'Treiber älter als ein Jahr: ' + (($old | ForEach-Object Name) -join ', ') }
if ($p.Count -eq 0) { '1' } else { $p -join ', ' }
'''
expect = "1"

[[tweak]]
id = "gpu.shader_cache_clear"
name = "Shader-Cache leeren"
category = "gpu"
kind = "oneshot"
description = "Löscht die Shader-Caches von NVIDIA, AMD und DirectX. Hilft nur bei beschädigten Caches oder Rucklern, die nach einem Treiber- oder Spiel-Update bleiben."
note = "Nur bei Problemen nutzen. Danach ruckeln die ersten Spielstarts, bis die Shader neu erstellt sind. Regelmäßiges Leeren bringt keine FPS."
evidence = "B"
risk = "low"
[[tweak.actions]]
type = "ps"
apply = '''
$dirs = "$env:LOCALAPPDATA\NVIDIA\DXCache", "$env:LOCALAPPDATA\NVIDIA\GLCache", "$env:LOCALAPPDATA\D3DSCache", "$env:LOCALAPPDATA\AMD\DxCache", "$env:LOCALAPPDATA\AMD\DxcCache", "$env:LOCALAPPDATA\AMD\VkCache"
$freed = 0
foreach ($d in $dirs | Where-Object { Test-Path -LiteralPath $_ }) {
  foreach ($f in Get-ChildItem -LiteralPath $d -Recurse -File -Force -ErrorAction SilentlyContinue) {
    $size = $f.Length
    Remove-Item -LiteralPath $f.FullName -Force -ErrorAction SilentlyContinue
    if (-not (Test-Path -LiteralPath $f.FullName)) { $freed += $size }
  }
}
'{0:N0} MB Shader-Cache gelöscht. Die ersten Spielstarts ruckeln, bis die Shader neu erstellt sind.' -f ($freed / 1MB)
'''
