[package]
name = "dialed"
version = "0.1.0"
edition = "2021"
description = "Windows-Tweaking-Tool mit Zustandserkennung"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dialed-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
