[package]
name = "dialed"
version = "0.1.4"
edition = "2021"
description = "Windows-Tweaking-Tool mit Zustandserkennung"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dialed-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com"] }
